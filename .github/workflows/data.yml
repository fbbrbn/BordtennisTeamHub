name: Data

# Refreshes match data from bordtennisportalen.dk for every pool of the season and
# publishes it to the `data` branch as a single commit (no history, so the repository
# stays small). The site build reads that branch.
#
# When (UTC): 05:23, 12:23, and every hour from 16:23 to 22:23 on match evenings (17 to 24 in
# Danish winter time). GitHub delays or drops many scheduled runs, so the clock workflow
# (clock.yml) starts each run itself. GitHub's own schedule stays as a backup that tries every
# slot several times: 05:23 and 05:53, 12:23 and 12:53, and four times an hour in the evening.
# The `check` job lets a scheduled attempt import only when the last import finished more than
# 50 minutes ago (30 for the clock's runs), so the portal still sees at most one import an hour.
# A run where no pool changed costs about one request per pool, roughly 2 minutes.
on:
  schedule:
    - cron: '23,53 5,12 * * *'
    - cron: '8,23,38,53 16-22 * * *'
  workflow_dispatch:
    inputs:
      clock:
        description: Started by the clock (skip the import if one finished in the last 30 minutes)
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.recent.outputs.run }}
    steps:
      # The clock starts the imports on time. Every data run starts it again if it has stopped.
      - name: Keep the clock running
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          running=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/clock.yml/runs?per_page=5" \
            -q '[.workflow_runs[] | select(.status != "completed")] | length')
          if [ "$running" = 0 ]; then
            echo "The clock had stopped: starting it."
            gh workflow run clock.yml --ref main
          fi
      # Each finished import leaves a small "import-done" artifact; its time is the last import.
      - name: Was there an import just before?
        id: recent
        env:
          GH_TOKEN: ${{ github.token }}
          CLOCK: ${{ inputs.clock }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            limit=3000
          elif [ "$CLOCK" = true ]; then
            limit=1800
          else
            echo "Started by hand: always import."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=import-done&per_page=1" -q '.artifacts[0].created_at // empty')
          if [ -n "$last" ] && [ $(( $(date +%s) - $(date -d "$last" +%s) )) -lt "$limit" ]; then
            echo "Last import finished at $last: this run is skipped."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  import:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore the current data
        run: |
          mkdir -p public/data
          if git fetch --depth 1 origin data; then git archive FETCH_HEAD | tar -x -C public/data; fi
          find public/data -type f -print0 | sort -z | xargs -0 -r sha1sum | sha1sum > "$RUNNER_TEMP/before.sha"
      # Finished seasons' form (history.ts writes form/<season>.json), so last season counts in the forecasts.
      - name: Fetch last season's form
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p history/form
          names=$(gh api "repos/$GITHUB_REPOSITORY/contents/form?ref=history" -q '.[].name' 2>/dev/null || true)
          for name in $names; do
            gh api "repos/$GITHUB_REPOSITORY/contents/form/$name?ref=history" -H 'Accept: application/vnd.github.raw' > "history/form/$name"
          done
          echo "Form files: ${names:-none}"
      - run: npm run import
      - name: Publish the data branch
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find public/data -type f -print0 | sort -z | xargs -0 -r sha1sum | sha1sum > "$RUNNER_TEMP/after.sha"
          if cmp -s "$RUNNER_TEMP/before.sha" "$RUNNER_TEMP/after.sha"; then
            echo "No data changes."
            exit 0
          fi
          cd public/data
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Match data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # Pushes made with the workflow token do not trigger other workflows, so start the deploy explicitly.
      - name: Redeploy the site
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --ref main
      - name: Mark the import as done
        run: date -u +%Y-%m-%dT%H:%M:%SZ > "$RUNNER_TEMP/import-done.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: import-done
          path: ${{ runner.temp }}/import-done.txt
          retention-days: 1
