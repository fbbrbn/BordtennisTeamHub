name: History

# Imports past seasons (back to 2011/2012) from bordtennisportalen.dk into the `history` branch,
# newest season first, for a few hours each night (00:41 UTC, 01:41 Danish time in winter).
# Past seasons do not change, so every pool and rating list is read only once: the whole backfill
# takes about two weeks of nights, and after that a run costs a handful of requests.
# Requests are spaced one second apart, and the run ends before the morning data refresh.
# The clock workflow (clock.yml) starts it; GitHub's own schedule stays as a backup, and when both
# start a run the same night, the `check` job skips the second one.
on:
  schedule:
    - cron: '41 0 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: Stop starting new work after this many minutes
        default: '240'
      clock:
        description: Started by the clock (skip the import if one finished in the last 12 hours)
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: history
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.recent.outputs.run }}
    steps:
      # Each night's import leaves a small "history-done" artifact; its time is the last import.
      - name: Was there a history import tonight?
        id: recent
        env:
          GH_TOKEN: ${{ github.token }}
          CLOCK: ${{ inputs.clock }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != schedule ] && [ "$CLOCK" != true ]; then
            echo "Started by hand: always import."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=history-done&per_page=1" -q '.artifacts[0].created_at // empty')
          if [ -n "$last" ] && [ $(( $(date +%s) - $(date -d "$last" +%s) )) -lt 43200 ]; then
            echo "The last history import finished at $last: this run is skipped."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  backfill:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check out the history branch
        run: |
          if git ls-remote --exit-code --heads origin history > /dev/null; then
            git fetch --depth 1 origin history
            git worktree add --detach history FETCH_HEAD
          else
            mkdir history
            git -C history init -q -b history
          fi
      - name: Import past seasons
        env:
          MINUTES: ${{ inputs.minutes || '240' }}
        run: node scraper/history.ts --out history --max-minutes "$MINUTES"
      # Files are written as they are read, so even a failed run publishes what it got.
      - name: Publish the history branch
        id: publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd history
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new."
            exit 0
          fi
          git commit -q -m "Past seasons $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/history
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # The site shows past seasons too. Pushes made with the workflow token start no workflows, so start it here.
      - name: Redeploy the site
        if: always() && steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --ref main
      - name: Mark the import as done
        if: always()
        run: date -u +%Y-%m-%dT%H:%M:%SZ > "$RUNNER_TEMP/history-done.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: history-done
          path: ${{ runner.temp }}/history-done.txt
          retention-days: 1
